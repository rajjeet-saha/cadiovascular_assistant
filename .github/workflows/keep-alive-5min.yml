name: Backend keep-alive (5 min)

# Complements keep-alive.yml: more frequent attempts to close the gap caused
# by GitHub cron delays (scheduled runs can start 10-20 minutes late).
# NOTE: GitHub auto-disables repo schedules after 60 days without a repo
# commit — push any commit (or re-enable in the Actions tab) if that happens.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 70 \
            https://cardiovascular-care-backend.onrender.com/ || echo "000")
          echo "HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::warning::Backend ping returned $CODE (may be waking from sleep)"
          fi
